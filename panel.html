<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة الطالب | exams</title>
  <link rel="icon" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --warn-bg: #fef3c7;
      --warn-text: #92400e;
      --badge: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Cairo", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    [hidden] { display: none !important; }

    /* شريط استكمال الملف الشخصي */
    .profile-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 10px 16px;
      background: var(--warn-bg);
      color: var(--warn-text);
      font-size: 14px;
      font-weight: 600;
    }
    .profile-bar a {
      background: var(--warn-text);
      color: #fff;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
    }
    .profile-bar a:hover { opacity: .9; }

    /* الشريط العلوي */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 16px;
      height: 64px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-size: 22px;
    }
    .brand img { width: 36px; height: 36px; object-fit: contain; }

    .menu {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-inline-start: 16px;
      flex: 1;
    }
    .menu a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      text-decoration: none;
      color: var(--text);
      font-weight: 600;
      font-size: 15px;
    }
    .menu a:hover { background: var(--bg); }
    .badge {
      background: var(--badge);
      color: #fff;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 700;
    }

    /* القائمة المنسدلة */
    .dropdown { position: relative; }
    .dropdown-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      max-width: 220px;
    }
    .dropdown-toggle:hover { background: var(--bg); }
    .dropdown-toggle .name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      display: grid; place-items: center;
      font-size: 13px; flex: none;
    }
    .dropdown-menu {
      position: absolute;
      inset-inline-end: 0;
      top: calc(100% + 8px);
      min-width: 190px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, .12);
      padding: 6px;
    }
    .dropdown-menu a,
    .dropdown-menu button {
      display: block;
      width: 100%;
      text-align: start;
      padding: 10px 12px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      text-decoration: none;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }
    .dropdown-menu a:hover,
    .dropdown-menu button:hover { background: var(--bg); }
    .dropdown-menu .danger { color: #b91c1c; }

    .hamburger {
      display: none;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 18px;
      cursor: pointer;
    }

    /* المحتوى */
    main { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
    .welcome {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
    }
    .welcome h2 { margin: 0 0 6px; font-size: 22px; }
    .welcome p { margin: 0; color: var(--muted); }
    .error-box {
      background: #fee2e2; color: #b91c1c;
      padding: 12px 16px; border-radius: 10px; margin-top: 16px;
    }

    @media (max-width: 760px) {
      .hamburger { display: inline-block; margin-inline-start: auto; }
      .menu {
        display: none;
        position: absolute;
        top: 64px; inset-inline: 0;
        flex-direction: column;
        align-items: stretch;
        margin: 0;
        padding: 8px 16px 12px;
        background: var(--card);
        border-bottom: 1px solid var(--border);
      }
      .menu.open { display: flex; }
      .dropdown-toggle .name { max-width: 110px; }
    }
  </style>
</head>
<body>
  <div id="profileBar" class="profile-bar" hidden>
    <span>ملفك الشخصي غير مكتمل.</span>
    <a href="/EditProfile.html">استكمال الملف الشخصي</a>
  </div>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="panel.html">
        <img src="images/logo.png" alt="شعار exams">
        <span>exams</span>
      </a>

      <button class="hamburger" id="hamburger" aria-label="القائمة" aria-expanded="false">☰</button>

      <nav class="menu" id="menu">
        <a href="content.html">المحتوى</a>
        <a href="notifications.html">الإشعارات <span class="badge" id="notifBadge"></span></a>
        <a href="videos.html">فيديو</a>
      </nav>

      <div class="dropdown">
        <button class="dropdown-toggle" id="userToggle" aria-haspopup="true" aria-expanded="false">
          <span class="avatar" id="avatar">؟</span>
          <span class="name" id="userName">...</span>
          <span aria-hidden="true">▾</span>
        </button>
        <div class="dropdown-menu" id="userMenu" hidden>
          <a href="EditProfile.html">الملف الشخصي</a>
          <button type="button" class="danger" id="logoutBtn">تسجيل الخروج</button>
        </div>
      </div>
    </div>
  </header>

  <main id="content" hidden>
    <section class="welcome">
      <h2 id="welcomeTitle"></h2>
      <p id="welcomeSub"></p>
    </section>
    <div id="errorBox" class="error-box" hidden></div>
  </main>

  <script type="module">
    import { currentStudentId, loadStudent, logout } from "./session.js";

    // عدد الإشعارات الجديدة (مؤقتًا ثابت، اربطه بالداتابيز لاحقًا)
    const NEW_NOTIFICATIONS = 9;

    const $ = (id) => document.getElementById(id);

    // ---- القوائم ----
    const hamburger = $("hamburger");
    const menu = $("menu");
    hamburger.addEventListener("click", () => {
      const open = menu.classList.toggle("open");
      hamburger.setAttribute("aria-expanded", String(open));
    });

    const userToggle = $("userToggle");
    const userMenu = $("userMenu");
    function setUserMenu(open) {
      userMenu.hidden = !open;
      userToggle.setAttribute("aria-expanded", String(open));
    }
    userToggle.addEventListener("click", (e) => {
      e.stopPropagation();
      setUserMenu(userMenu.hidden);
    });
    document.addEventListener("click", () => setUserMenu(false));
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") setUserMenu(false); });

    $("logoutBtn").addEventListener("click", () => {
      logout();
      location.replace("login.html");
    });

    if (NEW_NOTIFICATIONS > 0) $("notifBadge").textContent = `${NEW_NOTIFICATIONS} جديد`;
    else $("notifBadge").hidden = true;

    // ---- حماية الصفحة وتحميل بيانات الطالب ----
    (async () => {
      if (!currentStudentId()) {
        location.replace("login.html");
        return;
      }

      $("content").hidden = false;

      try {
        const student = await loadStudent();
        if (!student) {
          logout();
          location.replace("login.html");
          return;
        }

        const name = student.username || "طالب";
        $("userName").textContent = name;
        $("avatar").textContent = name.trim().charAt(0);
        $("welcomeTitle").textContent = `أهلًا ${name}`;
        $("welcomeSub").textContent = student.institution || "";

        // لو الملف الشخصي مش مكتمل نظهر الشريط
        if (student.profile_completed === false) {
          $("profileBar").hidden = false;
        }
      } catch (err) {
        $("welcomeTitle").textContent = "أهلًا بك";
        $("errorBox").hidden = false;
        $("errorBox").textContent = "تعذّر تحميل بيانات حسابك. حدّث الصفحة أو تواصل مع الإدارة.";
      }
    })();
  </script>
</body>
</html>
