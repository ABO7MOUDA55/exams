<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول | exams</title>
  <link rel="icon" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
      --danger: #b91c1c;
      --danger-bg: #fee2e2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      font-family: "Cairo", system-ui, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, #dbeafe 0%, var(--bg) 60%);
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, .12);
    }
    .brand { text-align: center; margin-bottom: 24px; }
    .brand img { width: 72px; height: 72px; object-fit: contain; }
    .brand h1 { margin: 8px 0 0; font-size: 28px; letter-spacing: .5px; }
    .brand p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    label { display: block; margin: 16px 0 6px; font-weight: 600; font-size: 14px; }
    .field { position: relative; }
    input {
      width: 100%;
      padding: 12px 14px;
      font: inherit;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
    }
    input:focus { outline: 2px solid var(--primary); outline-offset: 1px; border-color: transparent; }
    #studentId { direction: ltr; text-align: right; }
    #password { direction: ltr; text-align: right; padding-left: 64px; }
    .toggle {
      position: absolute;
      left: 8px; top: 50%;
      transform: translateY(-50%);
      border: 0; background: transparent;
      color: var(--primary);
      font: inherit; font-size: 13px; font-weight: 600;
      cursor: pointer; padding: 6px;
    }
    .error {
      margin-top: 16px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--danger-bg);
      color: var(--danger);
      font-size: 14px;
    }
    .error[hidden] { display: none; }
    button.submit {
      width: 100%;
      margin-top: 24px;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font: inherit; font-weight: 700; font-size: 16px;
      cursor: pointer;
    }
    button.submit:hover:not(:disabled) { background: var(--primary-dark); }
    button.submit:disabled { opacity: .6; cursor: wait; }
    .hint { margin-top: 16px; text-align: center; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <img src="images/logo.png" alt="شعار exams">
      <h1>exams</h1>
      <p>سجّل دخولك للمتابعة</p>
    </div>

    <form id="loginForm" novalidate>
      <label for="studentId">اسم المستخدم</label>
      <input id="studentId" type="text" inputmode="numeric" autocomplete="username" required>

      <label for="password">كلمة المرور</label>
      <div class="field">
        <input id="password" type="password" autocomplete="current-password" required>
        <button type="button" class="toggle" id="togglePass">إظهار</button>
      </div>

      <div id="error" class="error" role="alert" hidden></div>

      <button type="submit" class="submit" id="submitBtn">تسجيل الدخول</button>
    </form>

    <p class="hint">لو نسيت بياناتك تواصل مع إدارة الكلية.</p>
  </main>

  <script type="module">
    import { login, currentStudentId } from "./session.js";

    const form = document.getElementById("loginForm");
    const idInput = document.getElementById("studentId");
    const passInput = document.getElementById("password");
    const errorBox = document.getElementById("error");
    const submitBtn = document.getElementById("submitBtn");
    const toggleBtn = document.getElementById("togglePass");

    // لو الطالب مسجّل دخول بالفعل يروح للوحة مباشرة
    if (currentStudentId()) location.replace("panel.html");

    toggleBtn.addEventListener("click", () => {
      const show = passInput.type === "password";
      passInput.type = show ? "text" : "password";
      toggleBtn.textContent = show ? "إخفاء" : "إظهار";
    });

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.hidden = !msg;
    }

    function messageFor(code) {
      switch (code) {
        case "network":
          return "تعذّر الاتصال بالخدمة. تأكد من الشبكة وحاول مرة أخرى.";
        default:
          // رسالة موحدة عمدًا عشان ما نكشفش هل الحساب موجود ولا لأ
          return "اسم المستخدم أو كلمة المرور غير صحيحة.";
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      showError("");

      if (!idInput.value.trim() || !passInput.value) {
        showError("اكتب اسم المستخدم وكلمة المرور.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "جارٍ الدخول...";

      try {
        await login(idInput.value, passInput.value);
        location.replace("panel.html");
      } catch (err) {
        showError(messageFor(err.code));
        submitBtn.disabled = false;
        submitBtn.textContent = "تسجيل الدخول";
      }
    });
  </script>
</body>
</html>
